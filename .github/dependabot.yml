version: 2
updates:
  # First-party npm only. Vendored Foundry trees under lib/** are a
  # committed snapshot (lib is a normal tree, and there is no root
  # .gitmodules). Do not add an updates entry for them.
  #
  # PR #71 listed those directories and ignored dependency-name "*".
  # Dependabot still queued a version job for /lib/forge-std and
  # /lib/openzeppelin-contracts. The grouped security job then set
  # source.directories to /lib/openzeppelin-contracts and /points-worker
  # with ignore-conditions and exclude-paths both empty, so the ignore
  # never applied. exclude-paths is a version-updates option and would
  # not have been copied into that security job. Leaving lib/** unlisted
  # is what keeps those paths off both jobs.
  - package-ecosystem: "npm"
    directories:
      - "/wallet"
      - "/relayer"
      - "/points-worker"
    schedule:
      interval: "weekly"
