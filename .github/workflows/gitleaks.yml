name: Secrets

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Pinned gitleaks 8.30.1 binary. GITLEAKS_SHA256 is the linux_x64 digest
# published in gitleaks_8.30.1_checksums.txt. It is a public checksum.
# The wallet bundle scanner exempts that one assignment in this file.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          ver=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan PR commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GITLEAKS="$RUNNER_TEMP/gitleaks"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_SHA"
            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
            HEAD_SHA="$(git rev-parse FETCH_HEAD)"
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
            if [ "$count" -lt 1 ]; then
              echo "PR range ${BASE_SHA}..${HEAD_SHA} has no commits"
              exit 1
            fi
            LOG_OPTS="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${BEFORE}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              LOG_OPTS="--diff-merges=first-parent -1"
            else
              LOG_OPTS="--diff-merges=first-parent ${BEFORE}..${PUSH_SHA}"
            fi
          else
            LOG_OPTS="--diff-merges=first-parent -1"
          fi
          echo "gitleaks log-opts: ${LOG_OPTS}"
          "$GITLEAKS" detect --redact --no-banner --exit-code 1 --log-opts="${LOG_OPTS}"

  gitleaks-history:
    name: gitleaks full history
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          ver=8.30.1
          GITLEAKS_SHA256="$(sed -n 's/^[[:space:]]*GITLEAKS_SHA256=\([0-9a-fA-F]\{64\}\)$/\1/p' .github/workflows/gitleaks.yml | head -n 1)"
          if [ "${#GITLEAKS_SHA256}" -ne 64 ]; then
            echo "pinned checksum missing"
            exit 1
          fi
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full history
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" detect --redact --no-banner --exit-code 1 --log-opts="--diff-merges=first-parent"
