name: Tests

on:
  push:
    branches: [main, fix/issue-6-wrap-eth-dust]
  pull_request:
  workflow_dispatch:

# Unit tests only. Do not wire RELAYER_PRIVATE_KEY (or any hot key) into this
# job. Relayer secret consumption lives in relayer.yml and is runtime-only.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show forge version
        run: forge --version

      - name: Run tests
        run: forge test -vv
