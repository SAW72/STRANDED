name: Tests

on:
  push:
    branches: [main, fix/issue-6-wrap-eth-dust]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Unit tests only. Do not wire RELAYER_PRIVATE_KEY (or any hot key) into this
# job. Relayer secret consumption lives in relayer.yml and is runtime-only.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5

      - name: Show forge version
        run: forge --version

      - name: Run tests
        run: forge test -vv --no-match-path test/fork/TestDemoSupplyFork.t.sol

  # Public RPC. A missing URL must fail the test (MissingRpc), not vm.skip.
  fork-base:
    name: Base Sepolia fork
    runs-on: ubuntu-latest
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Require the Base RPC
        run: test -n "$BASE_SEPOLIA_RPC_URL"

      - name: Simulate Base B-steps
        run: forge test --match-path test/fork/TestDemoSupplyFork.t.sol --match-test test_base_simulatesB4ThenDeployAllowlistAndFund -vv

  fork-arb:
    name: Arb Sepolia fork
    runs-on: ubuntu-latest
    env:
      ARB_SEPOLIA_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Require the Arb RPC
        run: test -n "$ARB_SEPOLIA_RPC_URL"

      - name: Simulate Arb A-steps
        run: forge test --match-path test/fork/TestDemoSupplyFork.t.sol --match-test test_arb_simulatesDeployAllowlistAndRecommendedCap -vv

  # Base Sepolia fork proof for the delist steps. No key and no broadcast.
  # This workflow never sets BASE_SEPOLIA_RPC_URL. The job always uses the
  # public endpoint https://sepolia.base.org. --fork-url selects chain id 84532,
  # so the fork tests run. Without that fork, an unset env var skips them.
  # The suite line must show 10 passed and 0 skipped. This job is not a required
  # status check; a failure here is still a failure (no continue-on-error).
  fork:
    name: Base Sepolia delist fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5

      - name: Show forge version
        run: forge --version

      - name: Fork proof
        run: |
          set -euo pipefail
          RPC="https://sepolia.base.org"
          CHAIN="$(cast chain-id --rpc-url "$RPC")"
          echo "chain_id=${CHAIN}"
          test "$CHAIN" = "84532"
          forge test --match-contract BaseSepoliaDelistStepsTest -vv \
            --fork-url "$RPC" \
            --fork-block-number 48077171 \
            2>&1 | tee fork-summary.txt
          grep -F "10 passed; 0 failed; 0 skipped" fork-summary.txt

  # Wallet UX (Vite + vitest). No Relayer key. Fixtures when Relayer URL unset.
  wallet:
    name: Wallet build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wallet
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wallet/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
