name: Tests

on:
  push:
    branches: [main, fix/issue-6-wrap-eth-dust]
  pull_request:
  workflow_dispatch:

# Unit tests only. Do not wire RELAYER_PRIVATE_KEY (or any hot key) into this
# job. Relayer secret consumption lives in relayer.yml and is runtime-only.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show forge version
        run: forge --version

      - name: Run tests
        run: forge test -vv --no-match-path test/fork/TestDemoSupplyFork.t.sol

  # Public RPC. A missing URL must fail the test (MissingRpc), not vm.skip.
  fork-base:
    name: Base Sepolia fork
    runs-on: ubuntu-latest
    env:
      BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Require the Base RPC
        run: test -n "$BASE_SEPOLIA_RPC_URL"

      - name: Simulate Base B-steps
        run: forge test --match-path test/fork/TestDemoSupplyFork.t.sol --match-test test_base_simulatesB4ThenDeployAllowlistAndFund -vv

  fork-arb:
    name: Arb Sepolia fork
    runs-on: ubuntu-latest
    env:
      ARB_SEPOLIA_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Require the Arb RPC
        run: test -n "$ARB_SEPOLIA_RPC_URL"

      - name: Simulate Arb A-steps
        run: forge test --match-path test/fork/TestDemoSupplyFork.t.sol --match-test test_arb_simulatesDeployAllowlistAndRecommendedCap -vv

  # Wallet UX (Vite + vitest). No Relayer key. Fixtures when Relayer URL unset.
  wallet:
    name: Wallet build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wallet/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
