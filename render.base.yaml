# NOT a Render blueprint. Blueprint sync reads render.yaml only and ignores this file.
# Applying it creates a paid starter web service. Do not apply it until Spencer
# says GO. Paste TOKEN_ADDRESS, DEMO_TOKEN, and ROUTER_ADDRESS from the B1 and
# B2 receipts first. Do not point them at gMOCK or 0x94cC.
# The live Arb service stays in render.yaml.

services:
  - type: web
    name: stranded-relayer-base
    runtime: node
    plan: starter
    rootDir: relayer
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: GAS_RESCUE_SWAP_ADDRESS
        value: "0x21A1ADf810e64B5bd1d530D31abA6856b8DEf688"
      - key: TOKEN_ADDRESS
        sync: false
      - key: DEMO_TOKEN
        sync: false
      - key: ROUTER_ADDRESS
        sync: false
      - key: FEE_TO
        value: "0x30466A210961c0C2C13AF0A9d35dfC6E8858bA9D"
      - key: CHAIN_ID
        value: "84532"
      - key: RPC_URL
        value: "https://sepolia.base.org"
      - key: CORS_ORIGINS
        sync: false
      - key: KILL_SWITCH
        value: "0"
      - key: ADMIN_SECRET
        sync: false
      - key: DATA_DIR
        value: "./data"
      - key: BROADCAST_MAX_ATTEMPTS
        value: "3"
      - key: BROADCAST_RETRY_BASE_MS
        value: "200"
