# Stranded on Render — wallet (static web) + Arb Sepolia Relayer (Node web).
# After first deploy: set RELAYER_PRIVATE_KEY and CORS_ORIGINS in the dashboard.
# Custom domain: attach it to the `stranded` static site, then add https://your.domain to CORS_ORIGINS.

services:
  - type: web
    name: stranded
    runtime: static
    buildCommand: npm ci --prefix wallet && npm run build --prefix wallet
    # Vite writes the HTML shell into wallet/dist. Publish that folder, not wallet/ or wallet/public.
    staticPublishPath: wallet/dist
    # SPA fallback. Render ignores wallet/public/_redirects.
    # The wallet build also publishes points/index.html so /points is a real file.
    routes:
      - type: rewrite
        source: /points
        destination: /index.html
      - type: rewrite
        source: /points/*
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Not live until the Blueprint is synced. See DEPLOY.md. Spencer's step.
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_GAS_RESCUE_ADDRESS
        value: "0x21A1ADf810e64B5bd1d530D31abA6856b8DEf688"
      - key: VITE_TOKEN_ADDRESS
        value: "0xE36c35cbF0373D77D00732f7B92dB4fB8fd37166"
      - key: VITE_GAS_RESCUE_ADDRESS_ARB_SEPOLIA
        value: "0x65e712222745A8FCCbF038A90Fa75caB0867993D"
      - key: VITE_TOKEN_ADDRESS_ARB_SEPOLIA
        value: "0xE3cb1AC5EDc70D3a85250a8c00cBe3A45AFc616C"
      - key: VITE_RELAYER_URL_ARB_SEPOLIA
        fromService:
          type: web
          name: stranded-relayer-arb
          envVarKey: RENDER_EXTERNAL_URL
      # Optional: live Base Sepolia Relayer (VPS). Leave unset for sample quotes on Base.
      - key: VITE_RELAYER_URL
        sync: false

  - type: web
    name: stranded-relayer-arb
    runtime: node
    plan: starter
    rootDir: relayer
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: GAS_RESCUE_SWAP_ADDRESS
        value: "0x65e712222745A8FCCbF038A90Fa75caB0867993D"
      - key: TOKEN_ADDRESS
        value: "0xE3cb1AC5EDc70D3a85250a8c00cBe3A45AFc616C"
      - key: DEMO_TOKEN
        value: "0xE3cb1AC5EDc70D3a85250a8c00cBe3A45AFc616C"
      # LockedDemoSwapRouter (migrated 2026-10-01). Retired open router
      # 0x680410c7f64e06EB7e80dc7B5c149f7855e225A8 is delisted. Live
      # stranded-relayer-arb ROUTER_ADDRESS has been this value since
      # Oct 1, 2026, 1:27 PM ET (Relayer Backend deploy). Quotes return it.
      - key: ROUTER_ADDRESS
        value: "0xFE22f32eF7a8f64B6c9E1CCAe31817B54184f7fc"
      - key: FEE_TO
        value: "0x30466A210961c0C2C13AF0A9d35dfC6E8858bA9D"
      - key: CHAIN_ID
        value: "421614"
      - key: RPC_URL
        value: "https://sepolia-rollup.arbitrum.io/rpc"
      # Set in the dashboard, not here. Live value:
      # https://strandedtoken.trade,http://localhost:5173,http://127.0.0.1:5173
      # This service's onrender.com host is gas-rescue.onrender.com, not stranded.onrender.com.
      - key: CORS_ORIGINS
        sync: false
      # Relayer-side pause. Health stays 200 with paused=true.
      - key: KILL_SWITCH
        value: "0"
      - key: ADMIN_SECRET
        sync: false
      - key: DATA_DIR
        value: "./data"
      - key: BROADCAST_MAX_ATTEMPTS
        value: "3"
      - key: BROADCAST_RETRY_BASE_MS
        value: "200"
